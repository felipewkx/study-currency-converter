<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Conversor Global - Corporate Edition</title>
    <style>
     body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #dbda9f; color: #333; display: flex; justify-content: center; align-items: flex-start; padding: 20px; min-height: 100vh; margin: 0; }
        
        
        .app-container { background: white; padding: 20px; border-radius: 12px; width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); }
        
        h1 { font-size: 1.8rem; text-align: center; color: #2c3e50; margin-bottom: 15px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .field { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 1.5rem; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1.3rem; }
        .row { display: flex; gap: 8px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 0.9rem; }
        button:hover { background: #219150; }
        #resultado-box { margin-top: 15px; padding: 12px; background: #f1f2f6; border-radius: 8px; text-align: center; min-height: 40px; }
        #resultado-valor { font-size: 2.0rem; font-weight: bold; color: #27ae60; word-break: break-all; }
        .historico { margin-top: 15px; font-size: 1.5rem; border-top: 1px solid #eee; padding-top: 10px; }
        ul { padding-left: 15px; color: #666; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Global Currency Converter</h1>
    
    <div class="field">
        <label>Valor a converter:</label>
        <input type="number" id="quantia" placeholder="0.00" step="0.01" min="0">
    </div>

    <div class="row">
        <div class="field" style="flex: 1;">
            <label>De:</label>
            <select id="moeda-origem">
                <option value="BRL">Real (BRL)</option>
                <option value="USD">Dólar (USD)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="BTC">Bitcoin (BTC)</option>
            </select>
        </div>
        <div class="field" style="flex: 1;">
            <label>Para:</label>
            <select id="moeda-destino">
                <option value="USD">Dólar (USD)</option>
                <option value="BRL">Real (BRL)</option>
                <option value="EUR">Euro (EUR)</option>
                <option value="BTC">Bitcoin (BTC)</option>
            </select>
        </div>
    </div>

    <button id="btn-converter">Calcular Conversão</button>

    <div id="resultado-box">
        <span id="resultado-valor">---</span>
    </div>

    <div class="historico">
        <strong>Últimas 10 Consultas:</strong>
        <ul id="lista-historico"></ul>
    </div>
</div>

<script>
    
    const taxas = { BRL: 5.20, EUR: 0.92, USD: 1.00, BTC: 0.000015 };
    const btn = document.getElementById("btn-converter");
    const historico = [];

    btn.addEventListener("click", function() {
        const valorRaw = document.getElementById("quantia").value;
        const valor = parseFloat(valorRaw);
        const de = document.getElementById("moeda-origem").value;
        const para = document.getElementById("moeda-destino").value;

        
        if (isNaN(valor) || valor <= 0) {
            alert("Por favor, insira um valor válido e positivo.");
            return;
        }

        
        let valorEmDolar = valor / taxas[de];
        let resultadoFinal = valorEmDolar * taxas[para];

        
        const resultadoFormatado = new Intl.NumberFormat('pt-BR', { 
            style: 'currency', 
            currency: para 
        }).format(resultadoFinal);

        
        document.getElementById("resultado-valor").innerText = resultadoFormatado;

       
        const textoHistorico = `${valor.toFixed(2)} ${de} = ${resultadoFormatado}`;
        atualizarHistorico(textoHistorico);
    });

    function atualizarHistorico(novoTexto) {
        const lista = document.getElementById("lista-historico");
        
        
        historico.unshift(novoTexto);

        
        lista.innerHTML = "";

        
        for (let i = 0; i < Math.min(historico.length, 10); i++) {
            let li = document.createElement("li");
            li.innerText = historico[i];
            lista.appendChild(li);
        }
    }
</script>

</body>
</html>
